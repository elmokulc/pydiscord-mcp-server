[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pydiscord-mcp-server"
version = "0.2.0"
description = "Serveur MCP persistant pour un bot Discord"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.7.1,<3",
  "mcp>=2.3.0,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "starlette>=0.48,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
pydiscord-mcp-server = "pydiscord_mcp_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydiscord_mcp_server"]
