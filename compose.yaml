services:
  discord-mcp:
    build: .
    image: pydiscord-mcp-server:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8085"
    ports:
      - "127.0.0.1:${MCP_PORT:-8085}:8085"
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
